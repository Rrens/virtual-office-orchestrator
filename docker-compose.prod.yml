version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vo-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vopassword}
      POSTGRES_DB: ${POSTGRES_DB:-virtual_office}
    ports:
      - "5432:5432"
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vouser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vo-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: vo-prod-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_prod_data:/var/lib/zookeeper/data
      - zk_prod_log:/var/lib/zookeeper/log
    networks:
      - vo-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: vo-prod-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - vo-net

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: vo-prod-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vouser}:${POSTGRES_PASSWORD:-vopassword}@postgres:5432/${POSTGRES_DB:-virtual_office}?schema=public
      KAFKA_BROKER: kafka:9092
      OLLAMA_BASE_URL: http://192.168.0.2:11434
      PORT: 4000
      HOST: 0.0.0.0
    ports:
      - "4000:4000"
    networks:
      - vo-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vo-prod-web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    ports:
      - "3000:3000"
    networks:
      - vo-net

networks:
  vo-net:
    driver: bridge

volumes:
  pg_prod_data:
  zk_prod_data:
  zk_prod_log:
  kafka_prod_data:
